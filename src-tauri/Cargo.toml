[package]
name = "tnlauncher"
version = "0.2.5"
description = "Minecraft launcher"
edition = "2021"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (Tauri template convention).
name = "tnlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "time", "sync", "process", "io-util"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
discord-rich-presence = "1.1"
percent-encoding = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1", features = ["fs", "time", "sync", "macros", "rt-multi-thread"] }

# https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
strip = true
