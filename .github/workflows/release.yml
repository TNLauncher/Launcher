name: release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0, leave empty to use v<version>)'
        required: false
        type: string
      release_name:
        description: 'Release title (leave empty for TNLauncher <tag>)'
        required: false
        type: string
      version:
        description: 'App version override (e.g. 1.0.0, leave empty to read from tag or tauri.conf.json)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(jq -r .version src-tauri/tauri.conf.json)

          INPUT_TAG="${{ inputs.tag_name }}"
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_RELEASE_NAME="${{ inputs.release_name }}"

          if [ -z "$INPUT_TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            INPUT_TAG="${{ github.ref_name }}"
          fi

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
          else
            VERSION="$BASE_VERSION"
          fi

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION"
          fi

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            RELEASE_NAME="$INPUT_RELEASE_NAME"
          else
            RELEASE_NAME="TNLauncher $TAG"
          fi

          echo "Target tag: $TAG"
          echo "Target release name: $RELEASE_NAME"
          echo "App version: $VERSION"

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --method POST \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_NAME" \
            -F draft=true \
            -F prerelease=${{ inputs.prerelease && 'true' || 'false' }} \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - name: sync app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.APP_VERSION;
            if (!v) process.exit(0);

            const tcPath = "src-tauri/tauri.conf.json";
            const tc = JSON.parse(fs.readFileSync(tcPath, "utf8"));
            tc.version = v;
            fs.writeFileSync(tcPath, JSON.stringify(tc, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            let cargo = fs.readFileSync(cargoPath, "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync(cargoPath, cargo);

            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.id }}" -F draft=false
